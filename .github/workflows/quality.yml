name: BrickBit quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --prefix tests
      - run: python -m pip install numpy==2.2.6
      - run: npm test --prefix tests
      - run: python scripts/check_site.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
