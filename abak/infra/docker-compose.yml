# Abak — el sistema completo con cola de verdad.
#
# Para desarrollo NO hace falta: `make api` + `make web` levanta todo, con
# Celery en modo eager. Esto es para probar el camino de producción, donde la
# ejecución sale del hilo de la petición.
services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: { context: .., dockerfile: infra/Dockerfile.python }
    command: uvicorn abak_api.main:app --host 0.0.0.0 --port 8000
    environment:
      ABAK_REDIS: redis://redis:6379/0
      ABAK_INICIO: /datos
      ABAK_ORIGENES: http://localhost:3000
    volumes: ["abak-datos:/datos"]
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: infra/Dockerfile.python }
    command: celery -A abak_worker.celery_app worker -l info --concurrency 2
    environment:
      ABAK_REDIS: redis://redis:6379/0
      ABAK_INICIO: /datos
      ABAK_LIMITE_MEMORIA_GB: "4"
      ABAK_LIMITE_SEGUNDOS: "900"
    volumes: ["abak-datos:/datos"]
    depends_on:
      redis: { condition: service_healthy }
    # El worker ejecuta código generado. Corre sin privilegios, con el sistema
    # de archivos de sólo lectura salvo /datos y /tmp, y sin poder escalar
    # privilegios. Para multi-tenant hace falta además un sandbox por ejecución.
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 4g }

  web:
    build: { context: .., dockerfile: infra/Dockerfile.web }
    environment:
      ABAK_API: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  abak-datos:
