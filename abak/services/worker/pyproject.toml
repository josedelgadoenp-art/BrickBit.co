[project]
name = "abak-worker"
version = "0.1.0"
description = "Worker Celery de Abak"
requires-python = ">=3.11"
dependencies = [
  "abak-core",
  "celery>=5.3",
  "redis>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["abak_worker*"]
