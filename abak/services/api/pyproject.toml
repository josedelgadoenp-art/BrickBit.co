[project]
name = "abak-api"
version = "0.1.0"
description = "API REST de Abak (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "abak-core",
  "abak-worker",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "anthropic>=0.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["abak_api*"]
