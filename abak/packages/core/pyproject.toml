[project]
name = "abak-core"
version = "0.1.0"
description = "Núcleo de Abak: compilador de nodos, motor de ejecución y registro de herramientas"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pandas>=2.1",
  "numpy>=1.26",
  "statsmodels>=0.14",
  "scipy>=1.11",
  "plotly>=5.18",
]

[project.optional-dependencies]
# El núcleo corre sin esto; cada extra habilita una familia de herramientas.
espacial = ["libpysal>=4.9", "esda>=2.5", "spreg>=1.4"]
ml = ["scikit-learn>=1.4", "xgboost>=2.0"]
panel = ["linearmodels>=6.0"]
archivos = ["openpyxl>=3.1", "pyarrow>=15.0"]
# El informe sale sin figuras si falta kaleido: es opcional a propósito.
informe = ["fpdf2>=2.7", "kaleido>=0.2"]
todo = ["abak-core[espacial,ml,panel,archivos,informe]"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["abak_core*"]

[tool.setuptools.package-data]
abak_core = ["data/ejemplos/*.csv", "data/ejemplos/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
