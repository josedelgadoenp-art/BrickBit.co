# BrickBit · configuración de despliegue en Netlify
# Sitio estático (HTML en la raíz) + funciones serverless (netlify/functions).
# El Motor de Morfogénesis (app.py, Streamlit) NO corre en Netlify: se
# despliega desde este mismo repo en Streamlit Community Cloud
# (share.streamlit.io → app.py) y el sitio lo integra vía morfogenesis.html.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  # El listado de médicos ya no se publica como archivo estático: viaja dentro
  # del paquete de la función, que es la única que lo sirve (ver medicos.mjs).
  included_files = ["data/gnp_medicos_sin_pago_directo.txt"]

# HTML siempre se revalida (evita servir páginas viejas cacheadas)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# auth.js cambia con la lógica de sesión: que no se quede pegado
[[headers]]
  for = "/auth.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# /mycouple es un juego privado que vive en este dominio pero no forma parte
# del sitio: no se enlaza desde ninguna página, no está en sitemap.xml y esta
# cabecera le pide a los buscadores que no lo indexen ni sigan sus enlaces.
# A propósito NO se pone en robots.txt: ahí la ruta quedaría publicada.
[[headers]]
  for = "/mycouple/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# El listado de médicos sin pago directo de /financial/gmm nombra a personas
# identificables y sólo se muestra con sesión iniciada. Esta cabecera evita
# además que el archivo acabe indexado en buscadores. A propósito NO se pone en
# robots.txt: ahí la ruta quedaría publicada (mismo criterio que /mycouple).
[[headers]]
  for = "/data/gnp_medicos_sin_pago_directo.txt"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# /api/diagnostico guarda datos personales y financieros (ingreso, ahorro,
# situación de pensión) de quien completa el análisis de retiro. La función ya
# manda esta cabecera por su cuenta; aquí queda también a nivel de sitio por si
# alguna respuesta de error se sirve sin pasar por ella.
[[headers]]
  for = "/api/diagnostico"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# /api/lead guarda los prospectos de /financial (nombre, teléfono, edad,
# ingreso y el producto recomendado). Mismo criterio que /api/diagnostico.
[[headers]]
  for = "/api/lead"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Cabeceras básicas de seguridad para todo el sitio
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# NADA DE CÓDIGO FUENTE NI DATOS PRIVADOS POR HTTP
# `publish = "."` publica el repositorio ENTERO. Se comprobó en producción que
# /netlify/functions/lead.mjs, /CLAUDE.md y /scripts/*.py devolvían 200: el
# código de las funciones, las notas internas del proyecto y los scripts del
# modelo estaban a la vista de cualquiera. No había secretos ahí dentro (las
# funciones los leen de las variables de entorno), pero no tienen por qué
# servirse. `force = true` es lo que hace que la regla gane al archivo estático.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/backend/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

# El listado de médicos nombra a 713 personas identificables. La reja de la
# página nunca lo protegió —Netlify servía el .txt directo— así que la ruta
# estática se cierra y el contenido sale sólo por /api/medicos, contra un pase
# que emite /api/lead al pasar por la puerta de /financial/gmm.
[[redirects]]
  from = "/data/gnp_medicos_sin_pago_directo.txt"
  to = "/404.html"
  status = 404
  force = true

# URLs bonitas
[[redirects]]
  from = "/financial"
  to = "/financial.html"
  status = 200

# Análisis financiero de retiro (BrickBit Financial). El archivo vive en la
# raíz y aquí se le da la ruta bonita; así /financial sigue resolviendo a
# financial.html sin que exista una carpeta que compita con esa regla.
[[redirects]]
  from = "/financial/analisisfinanciero"
  to = "/analisisfinanciero.html"
  status = 200

[[redirects]]
  from = "/financial/analisisfinanciero/"
  to = "/analisisfinanciero.html"
  status = 200

# Mapa de la red hospitalaria GNP (BrickBit Financial). Mismo patrón que
# analisisfinanciero: el archivo vive en la raíz y aquí toma su ruta bonita,
# para no crear una carpeta /financial que compita con la regla de arriba.
[[redirects]]
  from = "/financial/gmm"
  to = "/gmm.html"
  status = 200

[[redirects]]
  from = "/financial/gmm/"
  to = "/gmm.html"
  status = 200

[[redirects]]
  from = "/aviso-de-privacidad"
  to = "/aviso-de-privacidad.html"
  status = 200

[[redirects]]
  from = "/morfogenesis"
  to = "/morfogenesis.html"
  status = 200

[[redirects]]
  from = "/presentacion"
  to = "/docs/presentacion-brickbit.html"
  status = 200
