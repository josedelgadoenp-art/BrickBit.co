[project]
name = "abaco-api"
version = "0.1.0"
description = "API REST de Ábaco (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "abaco-core",
  "abaco-worker",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["abaco_api*"]
