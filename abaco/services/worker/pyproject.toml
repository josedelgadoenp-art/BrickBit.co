[project]
name = "abaco-worker"
version = "0.1.0"
description = "Worker Celery de Ábaco"
requires-python = ">=3.11"
dependencies = [
  "abaco-core",
  "celery>=5.3",
  "redis>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["abaco_worker*"]
